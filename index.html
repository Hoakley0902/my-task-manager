<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div> 
        <h1> My Task Manager</h1>
        <p> Stay Organized, one task at a time</p>
    <section>
         <h2> Add a new task</h2>   
        
         <p>Total Tasks: <span id="totalTaskDisplay">0</span></p>
         <p>Tasks shown: <span id="tasksShownDisplay">0</span></p>
         <p>Completed tasks: <span id="completedTasksDisplay">0</span></p>
        <p> Remaining Tasks: <span id="remainingTasksDisplay">0</span></p>
        <p> Overdue Tasks: <span id="overdueTasksDisplay">0</span></p>



        
        <p> 
            <label for= "completionProgress">Completion: </label>
            <span id="completionPercentageDisplay">0%</span>
        </p>
        <progress id="completionProgress" value="0" max="100"></progress>
        
        <input 
         type="text" id="newTaskInput" placeholder="What needs to be done?">

<label for="taskPriority">Priority:</label>
    <select id="taskPriority">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
    </select>

<label for="taskCategory">Category:</label>
    <select id="taskCategory">
        <option value="personal">Personal</option>
        <option value="work">Work</option>
        <option value="learning">Learning</option>
    </select>

<label for="taskDueDate">Due Date:</label>
    <input type="date" id="taskDueDate">

<button id="addTaskBtn" type="button">
Add Task
</button>

<button id="deleteTaskBtn" type="button">
Delete Task
</button>

    </section>
    <section> 
        <h2> My Tasks</h2>

    <label for="categoryFilter">Show category:</label>
        <select id="categoryFilter">
            <option value="all">All</option>
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="learning">Learning</option>
        </select>


        <ul id="taskList"></ul>
    </section>

        </div>
    
    </main>

<script src="script.js"></script>
</body>
</html>
